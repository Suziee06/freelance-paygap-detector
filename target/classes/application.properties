# MySQL database connection url, pointing to 'freelance_db' database running locally on default port 3306
spring.datasource.url=jdbc:mysql://localhost:3306/freelance_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Database user name that Spring Boot will use to authenticate
spring.datasource.username=detector_user

# Database password for the above user
spring.datasource.password=SecureDetectorPass!

# MySQL driver to be used by Spring Data JPA
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tells Hibernate whether to automatically create or update database tables based on Java Entities (using 'update' is useful in dev mode)
spring.jpa.hibernate.ddl-auto=update

# Shows the SQL queries in the console log so you can debug what Database operations are happening
spring.jpa.show-sql=true

# Specifies the specific SQL dialect so Hibernate translates generic JPA queries into accurate MySQL syntax
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Defines the local development server port where your backend REST API will run
server.port=8080
